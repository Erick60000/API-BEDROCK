<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BRArchive Compiler</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="shell">
  <section class="hero">
    <span class="pill">MINECRAFT BEDROCK • BRARCHIVE</span>
    <h1>BRArchive<br><em>Compiler</em></h1>
    <p>Procesa tu <strong>.mcaddon</strong> y prepara sus packs usando el compilador BRArchive de referencia.</p>
  </section>

  <section class="panel">
    <label id="drop" class="drop" for="addon">
      <div class="cube">📦</div>
      <strong>Selecciona tu MCAddon</strong>
      <span>Toca para elegir un archivo desde tu teléfono</span>
      <input id="addon" type="file" accept=".mcaddon">
    </label>

    <div id="file" class="file hidden"></div>
    <button id="go" disabled>⚡ Compilar addon</button>

    <section id="progress" class="hidden">
      <div class="row"><span id="stage">Preparando…</span><b id="pct">0%</b></div>
      <div class="track"><div id="fill"></div></div>
      <div class="hint">No cierres esta página mientras se procesa el archivo.</div>
    </section>

    <section id="done" class="hidden done">
      <div class="check">✓</div>
      <h2>Compilación terminada</h2>
      <p id="doneText"></p>
      <a id="download" class="download">⬇ Descargar MCAddon</a>
      <button id="again" class="secondary">Procesar otro</button>
    </section>

    <div id="error" class="hidden error"></div>
  </section>

  <footer>BRArchive Compiler • procesamiento de archivos</footer>
</main>
<script src="app.js"></script>
</body>
</html>
